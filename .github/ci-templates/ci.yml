name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Strict Clippy (ADR-0002)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (ADR-0005)
        run: cargo test --workspace
      - name: Repository governance check (ADR-0001/ADR-0004)
        run: cargo run -p refractor-xtask -- check-repo
